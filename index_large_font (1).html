<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 优化了 viewport，禁止用户缩放，确保 PWA 应用的稳定显示 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- PWA iOS 专属配置 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="生存日语">
    
    <title>日本日常生存日语速查</title>

            --primary: #0077b6;
            --accent: #ff6b6b;
            --card-bg: #ffffff;
            --text-main: #1a1a1a;
            --text-sub: #6c757d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            /* 针对移动端优化字体族，增加可读性 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* 调整整体基准字号，适应 iPhone 屏幕 */
        html {
            font-size: 16px; /* 提高基准字号 */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* 增加顶部安全区适配，防止刘海遮挡 */
            padding: env(safe-area-inset-top, 20px) 16px 20px 16px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
        }

        h1 {
            font-size: 1.5rem; /* 增大标题 */
            color: var(--primary);
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 0.95rem; /* 增大副标题 */
            color: var(--text-sub);
        }

        /* 场景选择标签 */
        .category-tabs {
            display: flex;
            gap: 12px; /* 增大间距，方便手指点击 */
            overflow-x: auto;
            width: 100%;
            max-width: 450px;
            padding-bottom: 12px;
            margin-bottom: 16px;
            -webkit-overflow-scrolling: touch;
        }

        .category-tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background: #e9ecef;
            border: none;
            padding: 10px 16px; /* 增大按钮区域 */
            border-radius: 24px;
            font-size: 0.95rem; /* 增大标签字号 */
            cursor: pointer;
            white-space: nowrap;
            color: var(--text-main);
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .tab-btn.active {
            background: var(--primary);
            color: #fff;
            font-weight: bold;
        }

        /* 卡片区域 */
        .card {
            width: 100%;
            max-width: 450px; /* 卡片最大宽度略增 */
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px 20px; /* 增加内边距 */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
        }

        .situation-tag {
            display: inline-block;
            background: #e0f2fe;
            color: var(--primary);
            font-size: 0.85rem; /* 增大情景标签 */
            font-weight: bold;
            padding: 6px 10px;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .speaker-label {
            font-size: 0.9rem; /* 增大提示文字 */
            font-weight: bold;
            color: #8d99ae;
            margin-bottom: 8px;
        }

        .japanese-box {
            background: #f8fafc;
            border-left: 5px solid var(--primary); /* 加粗左边框 */
            padding: 16px; /* 增大内部留白 */
            border-radius: 4px 8px 8px 4px;
            margin-bottom: 16px;
            cursor: pointer;
        }

        .jp-text {
            font-size: 1.4rem; /* 显著增大日文原句字号 */
            font-weight: bold;
            color: #1e293b;
            line-height: 1.5;
            word-break: auto-phrase; /* 优化日语自动换行 */
        }

        .furigana {
            font-size: 1.05rem; /* 显著增大假名拼音字号，初学者最需要看清这个 */
            color: #475569;
            margin-top: 6px;
            letter-spacing: 0.5px;
        }

        .audio-hint {
            font-size: 0.85rem; /* 增大音频提示 */
            color: var(--primary);
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .chinese-text {
            font-size: 1.15rem; /* 增大中文释义字号 */
            color: #334155;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .reply-box {
            background: #fff5f5;
            border: 1px dashed var(--accent);
            border-radius: 10px;
            padding: 16px; /* 增大回复框内边距 */
            margin-top: 16px;
        }

        .reply-title {
            font-size: 0.95rem; /* 增大回复标题 */
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 10px;
        }

        .reply-item {
            font-size: 1.05rem; /* 显著增大回复选项字号 */
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 450px;
            margin-bottom: 10px;
        }

        .nav-btn {
            flex: 1;
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 16px; /* 增大按钮触摸面积 */
            border-radius: 14px;
            font-weight: bold;
            font-size: 1.1rem; /* 增大按钮字号 */
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,119,182,0.2);
        }

        .nav-btn.secondary {
            background: #cbd5e1;
            color: #334155;
            box-shadow: none;
        }

        .progress {
            font-size: 0.95rem; /* 增大进度提示 */
            color: #94a3b8;
            margin-top: 12px;
            text-align: center;
        }
    </style>
</head>

    <header>

        <button class="tab-btn" onclick="switchCategory(this, '第21-25课:思维与进阶')">21-25课:进阶</button>

            <div id="replies"></div>
        </div>
    </div>

            // --- 第 25 课 ---
            {
                category: "第21-25课:思维与进阶",
                situation: "第25课 · 设定条件（如果…的话）",
                jp: "時間があったら、旅行に行きたいです。",
                furigana: "じかんが あったら、りょこうに いきたいです。",
                cn: "要是有时间的话，我很想去旅行。",
                replies: [
                    "👉 <strong>询问去处</strong>：どこへ行きたいですか？（想去哪里呢？）"
                ]
            }
        ];

        let currentList = [...survivalCards];
        let currentIndex = 0;

        function renderCard() {
            if (currentList.length === 0) return;
            const item = currentList[currentIndex];

            document.getElementById('situation').innerText = item.situation;
            document.getElementById('jp-text').innerText = item.jp;
            document.getElementById('furigana').innerText = item.furigana;
            document.getElementById('cn-text').innerText = item.cn;

            const repContainer = document.getElementById('replies');
            repContainer.innerHTML = '';
            item.replies.forEach(r => {
                const div = document.createElement('div');
                div.className = 'reply-item';
                div.innerHTML = r;
                repContainer.appendChild(div);
            });

            document.getElementById('progress').innerText = `${currentIndex + 1} / ${currentList.length}`;
        }

        function switchCategory(btnEl, cat) {
            const btns = document.querySelectorAll('.tab-btn');
            btns.forEach(b => b.classList.remove('active'));
            btnEl.classList.add('active');

            if (cat === 'all') {
                currentList = [...survivalCards];
            } else {
                currentList = survivalCards.filter(c => c.category === cat);
            }
            currentIndex = 0;
            renderCard();
        }

        function nextCard() {
            if (currentIndex < currentList.length - 1) {
                currentIndex++;
            } else {
                currentIndex = 0;
            }
            renderCard();
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
            } else {
                currentIndex = currentList.length - 1;
            }
            renderCard();
        }

        // 升级版：高品质日语拟真发音
        function playVoice() {
            const text = document.getElementById('jp-text').innerText;
            
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // 停止上一段正在播放的音频

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ja-JP';
                utterance.rate = 0.9;  // 稍微放慢语速，清晰自然
                utterance.pitch = 1.05; // 略微提升音调，使日语音调更轻快温柔

                // 获取系统当前可用的所有语音包
                const voices = window.speechSynthesis.getVoices();
                
                // 优先筛选更自然的优质日文音色
                const bestJpVoice = voices.find(v => 
                    v.lang.includes('ja') && (
                        v.name.includes('Natural') || 
                        v.name.includes('Online') || 
                        v.name.includes('Nanami') || 
                        v.name.includes('Kyoko') || 
                        v.name.includes('Google 日本語') ||
                        v.name.includes('Neural')
                    )
                ) || voices.find(v => v.lang.includes('ja') || v.lang.includes('JP'));

                if (bestJpVoice) {
                    utterance.voice = bestJpVoice;
                }

                window.speechSynthesis.speak(utterance);
            } else {
                alert("当前环境不支持语音合成");
            }
        }

        // 预加载系统语音库
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

        // 初始化运行
        renderCard();
    </script>
</body>
</html>
